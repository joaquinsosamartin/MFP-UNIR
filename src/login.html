<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inicio de sesión</title>
</head>
<body>
  <main>
    <h1>Inicio de sesión</h1>

    <p id="login-description">Introduce tus credenciales para acceder a la aplicación.</p>

    <form action="/login" method="post" aria-describedby="login-description">
      <label for="email">Correo electrónico</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        required
      />

      <label for="password">Contraseña</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        minlength="8"
        required
      />

      <button type="submit">Iniciar sesión</button>
    </form>
  </main>
</body>
</html>
