<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Login</title>
</head>
<body>
  <main>
    <h1>Acceso a la plataforma</h1>

<p>Introduce tus credenciales</p>

<form>
  <label for="email">Email</label>
  <input
    id="email"
    name="email"
    type="email"
    required
  />

  <label for="password">Contraseña</label>
  <input
    id="password"
    name="password"
    type="password"
    placeholder="Introduce tu contraseña"
    required
    minlength="8"
  />

  <button type="submit">Entrar</button>
</form>
  </main>
</body>
</html>
